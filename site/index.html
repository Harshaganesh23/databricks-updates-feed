<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Databricks Updates</title>
<link rel="alternate" type="application/rss+xml" title="Databricks Updates" href="./feed.xml">
<script>
  // Applied synchronously, before first paint, so there's no flash of the wrong theme.
  (function () {
    try {
      var saved = localStorage.getItem("db-updates-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
  /* Palette adapted from databricks.com: Navy, Lava red, and Oat cream, with DM Sans/DM Mono. */
  :root {
    --bg: #f9f7f4;
    --bg2: #f2efe9;
    --panel: rgba(255,255,255,.72);
    --panel-solid: #ffffff;
    --surface-2: #eeede9;
    --border: #e2dfd7;
    --border2: #cbc6b9;
    --text: #1b3139;
    --text-dim: #5a6b72;
    --text-faint: #8c9aa0;
    /* Exact Databricks scale values (orange-04/orange-100) — kept as the only
       reds in the system so nothing drifts into an invented, slightly-off
       shade. Artificial Intelligence's category color reuses --accent
       directly (see CATEGORY_META in JS) rather than its own token, so the
       "hero" category color and the UI's interactive accent are always
       literally the same color, never two similar-but-different reds. */
    --accent: #ff3621;
    --accent2: #ff5f46;
    --accent-soft: #faecec;
    --focus: #1b3139;
    --good: #3e7a5e;
    --glass-blur: 16px;
    --radius: 18px;
    --shadow: 0 18px 44px -26px rgba(27,49,57,.35);

    /* Databricks' own scales, pulled from their live CSS: navy-100..800 and
       orange-01..06 (their internal name for the Lava red family). Only two
       chromatic hues exist in their real system — no gold/amber, no plum —
       so categories collapse to Lava (one hero: Artificial Intelligence, via
       --accent above) and a shared Navy tone for everything else,
       differentiated by icon shape rather than invented hues. */
    --tag-blog: #bd2b26;    --tag-blog-soft: #faecec;
    --tag-github: #143d4a;  --tag-github-soft: #edf2f8;
    --tag-notes: #1b5162;   --tag-notes-soft: #e5eaf1;
    --tag-linkedin: #6b6a5f; --tag-linkedin-soft: #ebe9e2;

    --cat-neutral: #143d4a; --cat-neutral-soft: #edf2f8;

    --mono: "DM Mono", ui-monospace, "SF Mono", Consolas, monospace;
    --sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181b; --bg2: #0e1315;
      --panel: rgba(27,49,57,.6); --panel-solid: #1b3139;
      --surface-2: #21383f; --border: #2d454d; --border2: #3d5860;
      --text: #f3f1ea; --text-dim: #b7c4c7; --text-faint: #7c9096;
      --accent: #ff5f46; --accent2: #ff9e94; --accent-soft: #3a1f1c; --focus: #f3f1ea;
      --good: #6fcf9e;
      --shadow: 0 20px 50px -22px rgba(0,0,0,.6);
      --tag-blog: #ff9e94;    --tag-blog-soft: #3a1f1c;
      --tag-github: #90a5b1;  --tag-github-soft: #1c2c33;
      --tag-notes: #c4ccd6;   --tag-notes-soft: #24363e;
      --tag-linkedin: #a3a89f; --tag-linkedin-soft: #2a2d28;
      --cat-neutral: #90a5b1; --cat-neutral-soft: #1c2c33;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12181b; --bg2: #0e1315;
    --panel: rgba(27,49,57,.6); --panel-solid: #1b3139;
    --surface-2: #21383f; --border: #2d454d; --border2: #3d5860;
    --text: #f3f1ea; --text-dim: #b7c4c7; --text-faint: #7c9096;
    --accent: #ff5f46; --accent2: #ff9e94; --accent-soft: #3a1f1c; --focus: #f3f1ea;
    --good: #6fcf9e;
    --shadow: 0 20px 50px -22px rgba(0,0,0,.6);
    --tag-blog: #ff9e94;    --tag-blog-soft: #3a1f1c;
    --tag-github: #90a5b1;  --tag-github-soft: #1c2c33;
    --tag-notes: #c4ccd6;   --tag-notes-soft: #24363e;
    --tag-linkedin: #a3a89f; --tag-linkedin-soft: #2a2d28;
    --cat-neutral: #90a5b1; --cat-neutral-soft: #1c2c33;
  }
  :root[data-theme="light"] {
    --bg: #f9f7f4; --bg2: #f2efe9;
    --panel: rgba(255,255,255,.72); --panel-solid: #ffffff;
    --surface-2: #eeede9; --border: #e2dfd7; --border2: #cbc6b9;
    --text: #1b3139; --text-dim: #5a6b72; --text-faint: #8c9aa0;
    --accent: #ff3621; --accent2: #ff5f46; --accent-soft: #faecec; --focus: #1b3139;
    --good: #3e7a5e;
    --shadow: 0 18px 44px -26px rgba(27,49,57,.35);
    --tag-blog: #bd2b26;    --tag-blog-soft: #faecec;
    --tag-github: #143d4a;  --tag-github-soft: #edf2f8;
    --tag-notes: #1b5162;   --tag-notes-soft: #e5eaf1;
    --tag-linkedin: #6b6a5f; --tag-linkedin-soft: #ebe9e2;
    --cat-neutral: #143d4a; --cat-neutral-soft: #edf2f8;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    font-optical-sizing: auto;
    background:
      radial-gradient(1000px 620px at 6% -10%, var(--accent-soft), transparent 60%),
      radial-gradient(900px 600px at 106% 0%, var(--cat-neutral-soft, transparent), transparent 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background .4s ease, color .3s ease;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  ::selection { background: var(--accent-soft); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  /* ---------- App layout ---------- */
  #app { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
  #sidebar {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    padding: 20px 14px; background: var(--panel);
    backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 3px; z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
  .brand img { height: 26px; width: auto; flex: none; }
  .brand-name { font-weight: 700; font-size: 14.5px; letter-spacing: -.1px; line-height: 1.15; }
  .brand-sub { font-size: 10.5px; color: var(--text-faint); font-weight: 600; letter-spacing: .3px; text-transform: uppercase; }
  .nav-label { font-size: 10px; font-weight: 700; color: var(--text-faint); letter-spacing: 1.2px; text-transform: uppercase; padding: 14px 10px 6px; font-family: var(--mono); }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px;
    color: var(--text-dim); font-weight: 600; font-size: 13px; cursor: pointer; border: 1px solid transparent;
    transition: background .15s, color .15s;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .nav-ico { width: 17px; height: 17px; flex: none; display: grid; place-items: center; }
  .nav-count { margin-left: auto; font-family: var(--mono); font-size: 10.5px; font-weight: 600; background: var(--surface-2); padding: 1px 7px; border-radius: 20px; color: var(--text-faint); }
  .nav-item.active .nav-count { background: rgba(0,0,0,.08); color: var(--accent); }
  .sidebar-footer { margin-top: auto; padding: 14px 10px 4px; font-size: 10.5px; color: var(--text-faint); line-height: 1.6; font-weight: 500; border-top: 1px solid var(--border); }
  .sidebar-footer img { height: 12px; opacity: .8; vertical-align: -1px; margin-right: 4px; }

  #main { min-width: 0; display: flex; flex-direction: column; }
  #topbar {
    position: sticky; top: 0; z-index: 25; display: flex; align-items: center; gap: 14px;
    padding: 12px 26px; background: var(--panel);
    backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
    border-bottom: 1px solid var(--border);
  }
  .crumbs { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-dim); font-weight: 600; flex-wrap: wrap; }
  .crumbs .c { cursor: pointer; }
  .crumbs .c:hover { color: var(--text); }
  .crumbs .sep { opacity: .5; }
  .crumbs .cur { color: var(--text); }
  .top-search { position: relative; }
  .top-search input {
    width: 210px; max-width: 38vw; padding: 8px 12px 8px 32px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel-solid); color: var(--text); font: inherit; font-size: 12.5px; font-weight: 500; outline: none; transition: .2s;
  }
  .top-search input:focus { border-color: var(--accent); width: 250px; box-shadow: 0 0 0 3px var(--accent-soft); }
  .topbar-select {
    flex: none;
    font: inherit; font-size: 12px; font-weight: 600; color: var(--text-dim);
    padding: 7px 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel-solid); cursor: pointer; outline: none; transition: .2s;
  }
  .topbar-select:first-of-type { margin-left: auto; }
  .topbar-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .top-search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
  .theme-switch { display: flex; flex: none; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 100px; background: var(--panel-solid); }
  .theme-btn { font-family: var(--mono); font-size: 10.5px; line-height: 1; padding: 6px 8px; border: none; border-radius: 100px; background: transparent; color: var(--text-faint); cursor: pointer; }
  .theme-btn:hover { color: var(--text-dim); }
  .theme-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .menu-btn { display: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-solid); color: var(--text); cursor: pointer; place-items: center; flex: none; }
  .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
  .scrim.show { display: block; }

  #view { padding: 30px 26px 70px; max-width: 1180px; width: 100%; margin: 0 auto; animation: viewIn .4s cubic-bezier(.2,.7,.3,1); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ---------- Generic ---------- */
  .eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
  h1.page { font-size: clamp(24px,3.4vw,30px); font-weight: 700; letter-spacing: -.02em; margin: 0 0 8px; line-height: 1.12; text-wrap: balance; }
  .lead { font-size: 14.5px; color: var(--text-dim); max-width: 68ch; line-height: 1.6; margin: 0 0 6px; }
  .card {
    background: var(--panel); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
    border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .section-title { font-size: 16px; font-weight: 700; letter-spacing: -.01em; margin: 34px 0 14px; display: flex; align-items: center; gap: 9px; }
  .section-title .bar { width: 3px; height: 16px; border-radius: 3px; background: var(--accent); }
  .latest-count {
    font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .03em;
    color: var(--accent); background: var(--accent-soft); padding: 2px 9px; border-radius: 20px;
  }
  .latest-live {
    display: inline-flex; align-items: center; gap: 6px; margin-left: auto;
    font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--good);
  }
  .latest-exact-date { font-size: 12px; color: var(--text-faint); margin: -8px 0 12px; }
  .latest-card { border-left: 3px solid var(--accent); padding-top: 2px; padding-bottom: 2px; }
  .latest-card .row { animation: latestRowIn .45s cubic-bezier(.2,.7,.3,1) backwards; }
  .latest-card .row:nth-child(1) { animation-delay: .03s; }
  .latest-card .row:nth-child(2) { animation-delay: .09s; }
  .latest-card .row:nth-child(3) { animation-delay: .15s; }
  .latest-card .row:nth-child(4) { animation-delay: .21s; }
  .latest-card .row:nth-child(n+5) { animation-delay: .26s; }
  @keyframes latestRowIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  /* hero */
  .hero { position: relative; overflow: hidden; padding: 30px 30px; margin-bottom: 22px; }
  .hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(500px 260px at 92% 8%, var(--accent-soft), transparent 60%); pointer-events: none; }
  .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 700; font-family: var(--mono); padding: 5px 12px; border-radius: 30px; background: var(--surface-2); border: 1px solid var(--border2); color: var(--text-dim); margin-bottom: 14px; }
  .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(62,122,94,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(62,122,94,.55); } 70% { box-shadow: 0 0 0 9px rgba(62,122,94,0); } 100% { box-shadow: 0 0 0 0 rgba(62,122,94,0); } }
  .hero h1 { position: relative; }
  .hero p.lead { position: relative; }

  /* stat tiles */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 14px; margin-bottom: 6px; }
  .stat { padding: 17px 19px; position: relative; overflow: hidden; }
  .stat-accent { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .stat .k { font-size: 11px; font-weight: 700; color: var(--text-faint); letter-spacing: .04em; text-transform: uppercase; }
  .stat .v { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .sub { font-size: 12px; color: var(--text-faint); margin-top: 5px; font-weight: 500; }
  .source-mini .k { margin-bottom: 8px; }
  .mini-bars { display: flex; flex-direction: column; gap: 7px; }
  .mini-bar-row { display: flex; align-items: center; gap: 7px; }
  .mini-label { width: 68px; flex: none; font-size: 11px; font-weight: 600; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini-track { flex: 1; height: 6px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
  .mini-fill { height: 100%; width: 0; border-radius: 6px; background: var(--accent); transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .mini-num { width: 22px; text-align: right; font-size: 11px; font-weight: 700; color: var(--text-faint); font-variant-numeric: tabular-nums; }

  /* category browse grid */
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(240px,1fr)); gap: 14px; }
  .cat-card { padding: 18px 20px; cursor: pointer; position: relative; overflow: hidden; transition: transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s; }
  .cat-card:hover { transform: translateY(-3px); box-shadow: 0 26px 50px -24px rgba(27,49,57,.4); }
  .cat-head { display: flex; align-items: center; gap: 11px; }
  .cat-ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; }
  .cat-name { font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; }
  .cat-count { font-size: 11.5px; color: var(--text-faint); font-weight: 600; margin-top: 1px; font-family: var(--mono); }
  .cat-teaser { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; margin: 13px 0 4px; min-height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .cat-recent { font-size: 11px; color: var(--text-faint); font-family: var(--mono); }

  /* chart cards */
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 14px; }
  .chart-card { padding: 20px 22px; }
  .chart-card h3 { margin: 0 0 3px; font-size: 14px; font-weight: 700; }
  .chart-card .sub { font-size: 11.5px; color: var(--text-faint); margin: 0 0 16px; font-weight: 500; }
  .bar-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 11px; font-size: 12px; }
  .bar-row .lbl { width: 108px; flex: none; font-weight: 600; color: var(--text); line-height: 1.25; padding-top: 1px; }
  .bar-row .bar-track { margin-top: 4px; }
  .bar-track { flex: 1; height: 10px; background: var(--surface-2); border-radius: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 8px; width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1); background: var(--accent); }
  .bar-row .num { width: 30px; text-align: right; font-weight: 700; color: var(--text-faint); flex: none; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; justify-content: center; }
  .legend span { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--text-dim); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  /* filters */
  .filters { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 16px; align-items: center; padding: 14px 16px; }
  .filters select, .filters input {
    padding: 8px 11px; border-radius: 9px; border: 1px solid var(--border); background: var(--panel-solid); color: var(--text);
    font-size: 12.5px; font-weight: 500; outline: none; transition: .2s; font-family: inherit;
  }
  .filters select:focus, .filters input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .filters .kw { flex: 1; min-width: 160px; }
  .filters .clear { cursor: pointer; color: var(--text-faint); font-size: 12px; font-weight: 600; padding: 8px 11px; border-radius: 9px; border: 1px solid var(--border); background: transparent; }
  .filters .clear:hover { color: var(--accent); border-color: var(--accent); }
  .res-count { font-size: 12.5px; color: var(--text-faint); font-weight: 600; margin-bottom: 10px; }

  /* item rows (dense, dividers not boxes) */
  .day-group { margin-bottom: 4px; }
  .day-heading { font-family: var(--mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-faint); margin: 0; padding: 13px 4px 5px; }
  .rows { display: flex; flex-direction: column; }
  .row { border-bottom: 1px solid var(--border); transition: background .15s; }
  .rows .row:last-child { border-bottom: none; }
  .row.open { background: var(--surface-2); border-radius: 10px; }
  .row-head { display: flex; align-items: flex-start; gap: 10px; padding: 9px 8px; cursor: pointer; user-select: none; }
  .row-top { display: flex; align-items: center; gap: 7px; margin-bottom: 2px; flex-wrap: wrap; }
  .badge { font-family: var(--mono); font-size: 10px; letter-spacing: .02em; padding: 2px 7px; border-radius: 100px; white-space: nowrap; }
  .badge.databricks_blog { color: var(--tag-blog); background: var(--tag-blog-soft); }
  .badge.github_release { color: var(--tag-github); background: var(--tag-github-soft); }
  .badge.release_notes { color: var(--tag-notes); background: var(--tag-notes-soft); }
  .badge.linkedin { color: var(--tag-linkedin); background: var(--tag-linkedin-soft); }
  .row-date { font-size: 11.5px; color: var(--text-faint); }
  .row-cat { font-family: var(--mono); font-size: 10px; letter-spacing: .03em; text-transform: uppercase; color: var(--text-faint); margin-left: auto; white-space: nowrap; }
  .row-title { font-size: 14px; font-weight: 600; line-height: 1.35; margin: 0; }
  .row-teaser { font-size: 12.5px; color: var(--text-dim); line-height: 1.4; margin: 2px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.open .row-teaser { display: none; }
  .row-chev { flex: none; color: var(--text-faint); transition: transform .3s; margin-top: 3px; }
  .row.open .row-chev { transform: rotate(180deg); }
  .row-body { max-height: 0; overflow: hidden; transition: max-height .4s cubic-bezier(.3,.7,.3,1); }
  .row.open .row-body { max-height: 600px; }
  .row-body-inner { padding: 0 16px 16px 34px; }
  .row-summary { font-size: 13px; line-height: 1.55; color: var(--text); white-space: pre-line; margin: 0 0 12px; }
  .row-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row-link { font-size: 12px; font-weight: 700; color: var(--accent); display: inline-flex; align-items: center; gap: 5px; }
  .row-link:hover { text-decoration: underline; }
  .row-tag { font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: var(--surface-2); color: var(--text-faint); }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-faint); }

  /* footer note inside a view */
  .view-footnote { font-size: 11.5px; color: var(--text-faint); line-height: 1.6; margin-top: 26px; }

  @media (max-width: 900px) {
    #app { grid-template-columns: 1fr; }
    #sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .3s; width: 252px; box-shadow: 0 0 50px rgba(0,0,0,.4); }
    #sidebar.open { transform: none; }
    .menu-btn { display: grid; }
    #view { padding: 20px 14px 60px; }
    .hero { padding: 22px 18px; }
    .top-search input { width: 140px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <div id="main">
    <div id="topbar"></div>
    <div id="view"></div>
  </div>
</div>

<script>
"use strict";

/* ============ Category & source metadata ============ */

// verified 2026-07-29) — not written for this project, quoted from theirs.

    icon: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"/><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/></svg>' },

  "Application Development": { key: "application-development", color: "var(--cat-neutral)", soft: "var(--cat-neutral-soft)",
    tagline: "Quickly build secure data and AI apps",

  "Customer Data Platform": { key: "customer-data-platform", color: "var(--cat-neutral)", soft: "var(--cat-neutral-soft)",
    tagline: "Agentic CDP embedded in Databricks",
    icon: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/><circle cx="18" cy="8" r="2.2"/></svg>' },
  "Platform Overview": { key: "platform-overview", color: "var(--cat-neutral)", soft: "var(--cat-neutral-soft)",

};
const CATEGORY_ORDER = Object.keys(CATEGORY_META);

const SOURCE_META = {
  databricks_blog: { label: "Blog", color: "var(--tag-blog)" },
  github_release: { label: "GitHub", color: "var(--tag-github)" },
  release_notes: { label: "Release Notes", color: "var(--tag-notes)" },

};
const SOURCE_ORDER = Object.keys(SOURCE_META);

const LOGO_URL = "https://www.databricks.com/sites/default/files/2024-10/Databricks-Logo-Icon.svg";

/* ============ Icons ============ */
const IC = {
  dash: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  grid: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
  search: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  chev: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>',
  menu: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>',
  arrow: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>',
  book: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  layers: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
  rss: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>',
};

/* ============ State ============ */
const state = {
  items: [],
  generatedAt: null,
  filters: { source: "", category: "", query: "" },
  dateRange: "",       // "" | "7" | "30" | "90" — global, applies across pages
  archiveIndex: [],    // [{month: "YYYY-MM", count}], newest first
  archiveCache: {},    // month -> items[], fetched on demand
};

/* ============ Helpers ============ */
function esc(s) { return (s == null ? "" : String(s)).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function byId(id) { return document.getElementById(id); }
function firstLine(s, max) {
  if (!s) return "";
  const line = s.split("\n")[0].trim();
  if (line.length <= max) return line;
  const cut = line.lastIndexOf(" ", max);
  return (cut > max * 0.4 ? line.slice(0, cut) : line.slice(0, max)).trim() + "…";
}
function catMeta(cat) { return CATEGORY_META[cat] || CATEGORY_META["Platform Overview"]; }
function catSlug(cat) { return catMeta(cat).key; }
function catBySlug(slug) { return CATEGORY_ORDER.find((c) => catMeta(c).key === slug); }

function sortKey(item) { return item.published || item.first_seen || ""; }
function formatDate(item) {
  const key = sortKey(item);
  if (!key) return "Undated";
  const [y, m, d] = key.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (item.tags && item.tags.includes("approx-date")) {
    return dt.toLocaleDateString(undefined, { year: "numeric", month: "long", timeZone: "UTC" });
  }
  return dt.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" });
}
function monthKey(item) {
  const key = sortKey(item);
  return key ? key.slice(0, 7) : null; // "YYYY-MM"
}
function monthLabel(ym) {
  const m = /^(\d{4})-(\d{2})$/.exec(ym || "");
  if (!m) return ym || "Undated";
  return new Date(Date.UTC(+m[1], +m[2] - 1, 1)).toLocaleDateString(undefined, { year: "numeric", month: "long", timeZone: "UTC" });
}
function formatDateStr(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" });
}
function relativeDay(iso) {
  if (!iso) return "";
  const then = new Date(iso + "T00:00:00Z").getTime();
  const days = Math.round((Date.now() - then) / 86400000);
  if (days <= 0) return "Updated today";
  if (days === 1) return "Updated yesterday";
  return `Updated ${days} days ago`;
}
function daysAgo(item, n) {
  const key = sortKey(item);
  if (!key) return false;
  const then = new Date(key + "T00:00:00Z").getTime();
  return (Date.now() - then) / 86400000 <= n;
}
function sortedDesc(items) { return [...items].sort((a, b) => (sortKey(b) > sortKey(a) ? 1 : sortKey(b) < sortKey(a) ? -1 : 0)); }

function inDateRange(item) { return !state.dateRange || daysAgo(item, Number(state.dateRange)); }
// Global filters (topbar: source + date range) apply on every page.
// Page-local filters (category dropdown, keyword search on All Updates) are
// layered on top via matchesFilters(), not folded in here.
function inGlobalFilters(item) {
  return inDateRange(item) && (!state.filters.source || item.source === state.filters.source);
}
function visibleItems() { return state.items.filter(inGlobalFilters); }

/* ============ Router ============ */
function go(hash) {
  if (location.hash === hash) route();
  else location.hash = hash;
  if (window.innerWidth <= 900) closeMenu();
}
function route() {
  const hash = location.hash || "#/dashboard";
  const parts = hash.replace(/^#\//, "").split("/");
  window.scrollTo({ top: 0, behavior: "auto" });

  if (parts[0] === "category" && parts[1]) {
    const cat = catBySlug(parts[1]);
    renderSidebar("cat-" + parts[1]);
    renderTopbar([{ label: "Dashboard", href: "#/dashboard" }, { label: cat || "Category" }]);
    renderCategoryPage(cat);
  } else if (parts[0] === "all") {
    renderSidebar("all");
    renderTopbar([{ label: "Dashboard", href: "#/dashboard" }, { label: "All Updates" }]);
    renderAllPage();
  } else if (parts[0] === "archive" && parts[1]) {
    renderSidebar("archive");
    renderTopbar([{ label: "Dashboard", href: "#/dashboard" }, { label: "Archive", href: "#/archive" }, { label: monthLabel(parts[1]) }]);
    renderArchiveMonthPage(parts[1]);
  } else if (parts[0] === "archive") {
    renderSidebar("archive");
    renderTopbar([{ label: "Dashboard", href: "#/dashboard" }, { label: "Archive" }]);
    renderArchivePage();
  } else {
    renderSidebar("dashboard");
    renderTopbar([{ label: "Dashboard" }]);
    renderDashboard();
  }
}
window.addEventListener("hashchange", route);

/* ============ Sidebar & Topbar ============ */
function categoryCounts() {
  const counts = new Map();
  visibleItems().forEach((i) => counts.set(i.category, (counts.get(i.category) || 0) + 1));
  return counts;
}
function sourceCounts() {
  const counts = new Map();
  visibleItems().forEach((i) => counts.set(i.source, (counts.get(i.source) || 0) + 1));
  return counts;
}

function renderSidebar(active) {
  const counts = categoryCounts();
  const archivedTotal = state.archiveIndex.reduce((s, m) => s + m.count, 0);
  let h = `<div class="brand"><img src="${LOGO_URL}" alt=""><div><div class="brand-name">Databricks Updates</div><div class="brand-sub">Community Changelog</div></div></div>`;
  h += `<div class="nav-label">Overview</div>`;
  h += navItem("dashboard", "#/dashboard", IC.dash, "Dashboard", null, active);
  h += navItem("all", "#/all", IC.grid, "All Updates", visibleItems().length, active);
  h += navItem("archive", "#/archive", IC.book, "Archive", archivedTotal, active);
  h += `<div class="nav-label">Browse by Platform Area</div>`;
  CATEGORY_ORDER.filter((c) => counts.get(c)).sort((a, b) => (counts.get(b) || 0) - (counts.get(a) || 0)).forEach((cat) => {
    const meta = catMeta(cat);
    h += `<div class="nav-item ${active === "cat-" + meta.key ? "active" : ""}" onclick="go('#/category/${meta.key}')">
      <span class="nav-ico" style="color:${meta.color}">${meta.icon}</span>${esc(cat)}<span class="nav-count">${counts.get(cat) || 0}</span></div>`;
  });
  h += `<div class="sidebar-footer"><img src="${LOGO_URL}" alt="">Not affiliated with or endorsed by Databricks.<br>Built by Harsha · refreshed daily.</div>`;
  byId("sidebar").innerHTML = h;
}
function navItem(id, href, ico, label, count, active) {
  return `<div class="nav-item ${active === id ? "active" : ""}" onclick="go('${href}')">
    <span class="nav-ico">${ico}</span>${esc(label)}${count != null ? `<span class="nav-count">${count}</span>` : ""}</div>`;
}

function renderTopbar(crumbs) {
  let c = `<button class="menu-btn" onclick="toggleMenu()">${IC.menu}</button><div class="crumbs">`;
  crumbs.forEach((cr, i) => {
    if (i > 0) c += `<span class="sep">/</span>`;
    c += cr.href ? `<span class="c" onclick="go('${cr.href}')">${esc(cr.label)}</span>` : `<span class="cur">${esc(cr.label)}</span>`;
  });
  c += `</div>
    <select id="sourceFilter" class="topbar-select">
      <option value="">All Sources</option>
      ${SOURCE_ORDER.map((s) => `<option value="${s}" ${state.filters.source === s ? "selected" : ""}>${SOURCE_META[s].label}</option>`).join("")}
    </select>
    <select id="dateRange" class="topbar-select">
      <option value="" ${state.dateRange === "" ? "selected" : ""}>All time</option>
      <option value="7" ${state.dateRange === "7" ? "selected" : ""}>Last 7 days</option>
      <option value="30" ${state.dateRange === "30" ? "selected" : ""}>Last 30 days</option>
      <option value="90" ${state.dateRange === "90" ? "selected" : ""}>Last 90 days</option>
    </select>
    <div class="top-search">${IC.search}<input id="globalSearch" placeholder="Search updates…" value="${esc(state.filters.query)}"></div>
    <div class="theme-switch" id="theme-switch">
      <button type="button" class="theme-btn" data-theme-choice="auto" title="Match system">Auto</button>
      <button type="button" class="theme-btn" data-theme-choice="light" title="Light">Light</button>
      <button type="button" class="theme-btn" data-theme-choice="dark" title="Dark">Dark</button>
    </div>`;
  byId("topbar").innerHTML = c;

  byId("globalSearch").addEventListener("input", (e) => {
    state.filters.query = e.target.value;
    if (!location.hash.startsWith("#/all")) go("#/all");
    else { renderAllPage(); byId("globalSearch") && byId("globalSearch").focus(); }
  });

  renderThemeSwitch();
  byId("theme-switch").addEventListener("click", (e) => {
    const btn = e.target.closest(".theme-btn");
    if (btn) setThemePref(btn.dataset.themeChoice);
  });

  byId("sourceFilter").addEventListener("change", (e) => {
    state.filters.source = e.target.value;
    route();
  });
  byId("dateRange").addEventListener("change", (e) => {
    state.dateRange = e.target.value;
    route();
  });
}

/* ============ Theme ============ */
const THEME_KEY = "db-updates-theme";
function getThemePref() {
  try { const s = localStorage.getItem(THEME_KEY); return s === "light" || s === "dark" ? s : "auto"; }
  catch (e) { return "auto"; }
}
function setThemePref(pref) {
  try { if (pref === "auto") localStorage.removeItem(THEME_KEY); else localStorage.setItem(THEME_KEY, pref); } catch (e) {}
  if (pref === "light" || pref === "dark") document.documentElement.setAttribute("data-theme", pref);
  else document.documentElement.removeAttribute("data-theme");
  renderThemeSwitch();
}
function renderThemeSwitch() {
  const el = byId("theme-switch"); if (!el) return;
  const pref = getThemePref();
  Array.from(el.children).forEach((btn) => btn.setAttribute("aria-pressed", btn.dataset.themeChoice === pref));
}

/* ============ Mobile menu ============ */
function toggleMenu() { byId("sidebar").classList.toggle("open"); byId("scrim").classList.toggle("show"); }
function closeMenu() { byId("sidebar").classList.remove("open"); byId("scrim").classList.remove("show"); }

/* ============ Charts ============ */
function barChart(entries) {
  const max = Math.max(1, ...entries.map((e) => e[1]));
  return entries.map(([label, count, color], i) => `
    <div class="bar-row">
      <div class="lbl">${esc(label)}</div>
      <div class="bar-track"><div class="bar-fill" data-w="${(count / max * 100).toFixed(1)}" style="transition-delay:${i * 0.05}s;${color ? `background:${color}` : ""}"></div></div>
      <div class="num">${count}</div>
    </div>`).join("");
}
function donutChart(entries) {
  const total = entries.reduce((s, e) => s + e[1], 0) || 1;
  const R = 48, C = 2 * Math.PI * R;
  let off = 0, arcs = "";
  entries.forEach(([label, count, color], i) => {
    const len = (count / total) * C;
    arcs += `<circle cx="64" cy="64" r="${R}" fill="none" stroke="${color}" stroke-width="18"
      stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 64 64)"
      style="opacity:0;animation:donutIn .8s ease forwards;animation-delay:${i * 0.15}s"/>`;
    off += len;
  });
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center">
    <svg width="128" height="128" viewBox="0 0 128 128">${arcs}
      <text x="64" y="60" text-anchor="middle" font-size="26" font-weight="700" fill="var(--text)">${total}</text>
      <text x="64" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text-faint)">ITEMS</text>
    </svg>
    <div class="legend" style="flex-direction:column;align-items:flex-start;gap:8px">
      ${entries.map(([label, count, color]) => `<span><i class="dot" style="background:${color}"></i>${esc(label)} · <b style="color:var(--text)">${count}</b></span>`).join("")}
    </div></div>`;
}
const donutKf = document.createElement("style");
donutKf.textContent = "@keyframes donutIn{from{opacity:0}to{opacity:1}}";
document.head.appendChild(donutKf);

function animateBars(root) {
  requestAnimationFrame(() => {
    (root || document).querySelectorAll(".bar-fill, .mini-fill").forEach((b) => { b.style.width = b.getAttribute("data-w") + "%"; });
  });
}
function animateCounters(root) {
  requestAnimationFrame(() => {
    (root || document).querySelectorAll(".v[data-count]").forEach((el) => {
      const target = +el.getAttribute("data-count");
      let cur = 0; const step = Math.max(1, Math.ceil(target / 24));
      const t = setInterval(() => { cur += step; if (cur >= target) { cur = target; clearInterval(t); } el.textContent = cur; }, 22);
    });
  });
}

/* ============ Stat tile ============ */
function statTile(k, v, sub, color) {
  return `<div class="card stat"><div class="stat-accent" style="background:${color}"></div>
    <div class="k">${esc(k)}</div><div class="v" data-count="${v}">0</div><div class="sub">${esc(sub)}</div></div>`;
}

// Compact source breakdown sized to sit in the stat-tile row rather than as
// its own full-width section — a source split isn't substantial enough to
// earn a whole chart card of its own.
function sourceMiniCard(sourceEntries) {
  const max = Math.max(1, ...sourceEntries.map(([, c]) => c));
  return `<div class="card stat source-mini">
    <div class="k">Sources</div>
    <div class="mini-bars">
      ${sourceEntries.map(([label, count]) => `
        <div class="mini-bar-row">
          <span class="mini-label">${esc(label)}</span>
          <div class="mini-track"><div class="mini-fill" data-w="${(count / max * 100).toFixed(0)}"></div></div>
          <span class="mini-num">${count}</span>
        </div>`).join("")}
    </div>
  </div>`;
}

/* ============ Item rows (shared list component) ============ */
function itemRow(item) {
  const meta = catMeta(item.category);
  const teaser = firstLine(item.summary, 90);
  return `<div class="row" id="row-${item.id}">
    <div class="row-head" onclick="toggleRow('${item.id}')">
      <div style="flex:1;min-width:0">
        <div class="row-top">
          <span class="badge ${item.source}">${esc(SOURCE_META[item.source] ? SOURCE_META[item.source].label : item.source_label)}</span>
          <span class="row-date">${formatDate(item)}</span>
          <span class="row-cat">${esc(item.category)}</span>
        </div>
        <p class="row-title">${esc(item.title)}</p>
        ${teaser ? `<p class="row-teaser">${esc(teaser)}</p>` : ""}
      </div>
      <span class="row-chev">${IC.chev}</span>
    </div>
    <div class="row-body"><div class="row-body-inner">
      ${item.summary ? `<p class="row-summary">${esc(item.summary)}</p>` : ""}
      <div class="row-meta">
        <a class="row-link" href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">View source ${IC.arrow}</a>
        <span class="row-tag" style="color:${meta.color};background:${meta.soft}">${esc(item.category)}</span>
      </div>
    </div></div>
  </div>`;
}
function toggleRow(id) { const row = byId("row-" + id); if (row) row.classList.toggle("open"); }

function renderRowList(container, items) {
  if (items.length === 0) { container.innerHTML = `<p class="empty">No updates match your filters.</p>`; return; }
  const groups = new Map();
  items.forEach((item) => {
    const key = formatDate(item);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  });
  let h = "";
  groups.forEach((groupItems, key) => {
    h += `<div class="day-group"><p class="day-heading">${esc(key)}</p><div class="rows">${groupItems.map(itemRow).join("")}</div></div>`;
  });
  container.innerHTML = h;
}

/* ============ Views ============ */
function renderDashboard() {
  const items = visibleItems();
  const total = items.length;
  const cCounts = categoryCounts();
  const sCounts = sourceCounts();
  const thisMonth = items.filter((i) => daysAgo(i, 30)).length;
  const activeSources = SOURCE_ORDER.filter((s) => sCounts.get(s)).length;

  let h = `<div class="card hero">
    <h1 class="page">Databricks Updates</h1>
    <p class="lead">Blog posts, release notes, and GitHub releases from Databricks — sorted by product area, refreshed daily.</p>
  </div>`;

  h += `<div class="stat-grid">
    ${statTile("Updates Tracked", total, "Across all sources", "var(--accent)")}
    ${statTile("Last 30 Days", thisMonth, "New updates", "var(--good)")}
    ${statTile("Sources Active", activeSources, `of ${SOURCE_ORDER.length} configured`, "var(--cat-neutral)")}
    ${statTile("Platform Areas", cCounts.size, "Classified categories", "var(--accent2)")}
  </div>`;

  const sourceEntries = SOURCE_ORDER.filter((s) => sCounts.get(s)).map((s) => [SOURCE_META[s].label, sCounts.get(s) || 0, SOURCE_META[s].color]);
  const catEntries = CATEGORY_ORDER.filter((c) => cCounts.get(c)).sort((a, b) => (cCounts.get(b) || 0) - (cCounts.get(a) || 0)).map((c) => [c, cCounts.get(c) || 0, catMeta(c).color]);

  const months = new Map();
  state.items.forEach((i) => { const mk = monthKey(i); if (mk) months.set(mk, (months.get(mk) || 0) + 1); });
  const monthEntries = Array.from(months.keys()).sort().slice(-8).map((mk) => [monthLabel(mk), months.get(mk)]);

  // "By Platform Area" gets its own full-width row rather than sitting
  // alongside the donut/timeline — with 11 categories it's much taller than
  // either of those, and a shared grid row stretches every cell to match the
  // tallest one, leaving the donut and timeline cards mostly empty padding.
  h += `<div class="section-title"><span class="bar"></span>Overview</div>
    <div class="chart-grid">
      <div class="card chart-card"><h3>By Source</h3><p class="sub">Where updates come from</p>${donutChart(sourceEntries)}</div>
      <div class="card chart-card"><h3>Updates Over Time</h3><p class="sub">Last ${monthEntries.length} months</p>${barChart(monthEntries)}</div>
    </div>
    <div class="card chart-card" style="margin-top:14px"><h3>By Platform Area</h3><p class="sub">What they're about</p>${barChart(catEntries)}</div>`;

  h += `<div class="section-title"><span class="bar"></span>Browse by Platform Area</div><div class="cat-grid">`;
  catEntries.forEach(([cat, count]) => {
    const meta = catMeta(cat);
    const recent = sortedDesc(items.filter((i) => i.category === cat))[0];
    const recent30 = items.filter((i) => i.category === cat && daysAgo(i, 30)).length;
    h += `<div class="card cat-card" onclick="go('#/category/${meta.key}')">
      <div class="cat-head">
        <div class="cat-ico" style="background:${meta.soft};color:${meta.color}">${meta.icon}</div>
        <div><div class="cat-name">${esc(cat)}</div><div class="cat-count">${count} updates</div></div>
      </div>
      <p class="cat-teaser">${recent ? esc(firstLine(recent.title, 110)) : ""}</p>
      <p class="cat-recent">${recent30} in the last 30 days</p>
    </div>`;
  });
  h += `</div>`;

  // Everything added in the most recent successful fetch run — regardless of
  // the date-range filter above, so narrowing the window never hides today's
  // update. Uses the data's own latest first_seen, not the viewer's clock, so
  // it stays honest if a scheduled run doesn't fire.
  const latestSeen = state.items.reduce((max, i) => (i.first_seen && i.first_seen > max ? i.first_seen : max), "");
  const latestItems = sortedDesc(state.items.filter((i) => i.first_seen === latestSeen));
  h += `<div class="section-title">
      <span class="bar"></span>Latest Update
      ${latestSeen ? `<span class="latest-live"><span class="pulse-dot"></span>${esc(relativeDay(latestSeen))}</span>` : ""}
      ${latestItems.length ? `<span class="latest-count">${latestItems.length} new</span>` : ""}
    </div>`;
  if (latestItems.length) {
    h += `<p class="latest-exact-date">${esc(formatDateStr(latestSeen))}</p>`;
    h += `<div class="card latest-card"><div class="rows">${latestItems.map(itemRow).join("")}</div></div>`;
  } else {
    h += `<p class="empty">No new updates in the most recent refresh.</p>`;
  }

  h += `<p class="view-footnote">Categories are assigned by keyword matching at fetch time, not hand-curated — expect the occasional miss. Updates older than 90 days move to the <a href="#/archive" onclick="event.preventDefault();go('#/archive')" style="color:var(--accent);font-weight:600">Archive</a>. <a href="./feed.xml" style="color:var(--accent);font-weight:600">${IC.rss} Subscribe via RSS</a></p>`;

  byId("view").innerHTML = h;
  animateBars(); animateCounters();
}

function renderCategoryPage(cat) {
  if (!cat) { go("#/dashboard"); return; }
  const meta = catMeta(cat);
  const items = sortedDesc(visibleItems().filter((i) => i.category === cat));
  const sCounts = new Map();
  items.forEach((i) => sCounts.set(i.source, (sCounts.get(i.source) || 0) + 1));
  const recent30 = items.filter((i) => daysAgo(i, 30)).length;
  const recent7 = items.filter((i) => daysAgo(i, 7)).length;
  const sourceList = SOURCE_ORDER.filter((s) => sCounts.get(s)).map((s) => SOURCE_META[s].label).join(", ");

  let h = `<div class="card hero" style="--accent-soft:${meta.soft}">
    <div class="pill" style="color:${meta.color}"><span class="cat-ico" style="width:auto;height:auto;display:inline-flex;color:${meta.color}">${meta.icon}</span>${esc(cat)}</div>
    <h1 class="page">${esc(cat)}</h1>
    <p class="lead">${meta.tagline ? esc(meta.tagline) + " — " : ""}${items.length} update${items.length !== 1 ? "s" : ""}${sourceList ? " from " + esc(sourceList) : ""}.</p>
  </div>`;

  const sourceEntries = SOURCE_ORDER.filter((s) => sCounts.get(s)).map((s) => [SOURCE_META[s].label, sCounts.get(s) || 0]);
  h += `<div class="stat-grid">
    ${statTile("Total", items.length, "In this area", meta.color)}
    ${statTile("Last 30 Days", recent30, "New updates", "var(--good)")}
    ${statTile("Last 7 Days", recent7, "New updates", "var(--accent2)")}
    ${sourceMiniCard(sourceEntries)}
  </div>`;

  h += `<div class="section-title"><span class="bar"></span>Updates</div><div id="rowList"></div>`;

  byId("view").innerHTML = h;
  renderRowList(byId("rowList"), items);
  animateBars(); animateCounters();
}

function matchesFilters(item) {
  if (!inGlobalFilters(item)) return false;
  if (state.filters.category && item.category !== state.filters.category) return false;
  if (state.filters.query) {
    const q = state.filters.query.trim().toLowerCase();
    if (q) {
      const blob = (item.title + " " + item.summary + " " + item.category + " " + item.source_label).toLowerCase();
      if (!blob.includes(q)) return false;
    }
  }
  return true;
}

function renderAllPage() {
  let h = `<p class="eyebrow">Explore</p><h1 class="page">All Updates</h1>
    <p class="lead">Search and filter every tracked update across every source and platform area.</p>`;

  h += `<div class="filters card">
    <input class="kw" id="fKw" placeholder="Search updates…" value="${esc(state.filters.query)}">
    <select id="fCat"><option value="">All Platform Areas</option>${CATEGORY_ORDER.map((c) => `<option value="${esc(c)}" ${state.filters.category === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
    <button class="clear" onclick="clearFilters()">Clear</button>
  </div>`;

  const filtered = sortedDesc(state.items.filter(matchesFilters));
  h += `<div class="res-count">${filtered.length} update${filtered.length !== 1 ? "s" : ""} found</div>`;
  h += `<div id="rowList"></div>`;

  byId("view").innerHTML = h;
  renderRowList(byId("rowList"), filtered);

  byId("fCat").addEventListener("change", (e) => { state.filters.category = e.target.value; refreshAll(); });
  byId("fKw").addEventListener("input", (e) => { state.filters.query = e.target.value; refreshAllKeepFocus(); });
}
function refreshAll() {
  const filtered = sortedDesc(state.items.filter(matchesFilters));
  byId("view").querySelector(".res-count").textContent = `${filtered.length} update${filtered.length !== 1 ? "s" : ""} found`;
  renderRowList(byId("rowList"), filtered);
  const gs = byId("globalSearch"); if (gs) gs.value = state.filters.query;
}
function refreshAllKeepFocus() {
  refreshAll();
  const gs = byId("globalSearch"); if (gs) gs.value = state.filters.query;
}
function clearFilters() {
  // Leaves state.filters.source alone — that's the global topbar control now,
  // not something this page's "Clear" button should reach out and reset.
  state.filters.category = "";
  state.filters.query = "";
  renderAllPage();
  const gs = byId("globalSearch"); if (gs) gs.value = "";
}

function renderArchivePage() {
  let h = `<p class="eyebrow">History</p><h1 class="page">Archive</h1>
    <p class="lead">Everything published before the last 90 days, organized by month — pick one to browse what shipped.</p>`;

  if (!state.archiveIndex.length) {
    h += `<p class="empty">No archived updates yet — everything currently tracked is still within the live window.</p>`;
  } else {
    h += `<div class="cat-grid">`;
    state.archiveIndex.forEach(({ month, count }) => {
      h += `<div class="card cat-card" onclick="go('#/archive/${month}')">
        <div class="cat-head"><div class="cat-ico" style="background:var(--cat-neutral-soft);color:var(--cat-neutral)">${IC.book}</div>
        <div><div class="cat-name">${esc(monthLabel(month))}</div><div class="cat-count">${count} updates</div></div></div>
      </div>`;
    });
    h += `</div>`;
  }

  byId("view").innerHTML = h;
}

function bySourceFilter(item) { return !state.filters.source || item.source === state.filters.source; }

function renderArchiveMonthResults(month) {
  const items = sortedDesc(state.archiveCache[month].filter(bySourceFilter));
  const countEl = byId("archiveMonthCount");
  if (countEl) countEl.textContent = `${items.length} update${items.length !== 1 ? "s" : ""}${state.filters.source ? " · " + SOURCE_META[state.filters.source].label + " only" : ""}`;
  renderRowList(byId("rowList"), items);
}

function renderArchiveMonthPage(month) {
  byId("view").innerHTML = `<p class="eyebrow">Archive</p><h1 class="page">${esc(monthLabel(month))}</h1>
    <p class="res-count" id="archiveMonthCount"></p><div id="rowList"><p class="loading">Loading…</p></div>`;

  if (state.archiveCache[month]) {
    renderArchiveMonthResults(month);
    return;
  }
  fetch(`./archive/${month}.json`)
    .then((r) => r.json())
    .then((items) => {
      state.archiveCache[month] = items;
      renderArchiveMonthResults(month);
    })
    .catch(() => {
      byId("rowList").innerHTML = `<p class="empty">Couldn't load this month's archive.</p>`;
    });
}

/* ============ Boot ============ */
function boot(payload, archiveIndex) {
  state.items = payload.items || payload;
  state.generatedAt = payload.generated_at || null;
  state.archiveIndex = archiveIndex || [];
  route();
}

if (window.__PRELOADED_DATA__) {
  boot(window.__PRELOADED_DATA__, window.__PRELOADED_ARCHIVE_INDEX__ || []);
} else {
  Promise.all([
    fetch("./data.json").then((r) => r.json()),
    fetch("./archive/index.json").then((r) => r.json()).catch(() => []),
  ])
    .then(([payload, archiveIndex]) => boot(payload, archiveIndex))
    .catch(() => {
      byId("view").innerHTML = '<p class="empty">Couldn\'t load updates. Try refreshing.</p>';
    });
}

byId("scrim").addEventListener("click", closeMenu);
</script>
</body>
</html>
